name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      AIHUB_REMOTE_AGENT_STATE: ${{ github.workspace }}/../aihub-agent-state
      AIHUB_REMOTE_AGENT_CONFIG: ${{ github.workspace }}/../aihub-agent-config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Create isolated runner configuration
        run: npm run configure -- --root .
      - run: npm run check
      - run: npm run self-test
      - name: Windows process lifecycle smoke
        if: runner.os == 'Windows'
        run: npm run test:windows
      - name: Windows install, upgrade and rollback smoke
        if: runner.os == 'Windows'
        run: npm run test:installer
